name: Build PCF solution

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write   # needed to attach zips to a GitHub Release on tag pushes

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install Power Platform CLI
        shell: pwsh
        run: |
          dotnet tool install --global Microsoft.PowerApps.CLI.Tool
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Build PCF and package solution (managed + unmanaged)
        shell: pwsh
        run: ./scripts/Build-Solution.ps1 -PublisherName "Talha" -PublisherPrefix "tal" -SolutionName "CountrySelector" -PackageType Both

      - name: Upload solution zips
        uses: actions/upload-artifact@v4
        with:
          name: CountrySelector-solution
          path: Solution/CountrySelector/bin/Release/*.zip
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Solution/CountrySelector/bin/Release/*.zip
