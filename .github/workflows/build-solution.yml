name: Build PCF solution

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write   # needed to attach zips to a GitHub Release on tag pushes

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install Power Platform CLI
        shell: pwsh
        run: |
          dotnet tool install --global Microsoft.PowerApps.CLI.Tool
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Build PCF and package solution (managed + unmanaged)
        shell: pwsh
        run: ./scripts/Build-Solution.ps1 -PublisherName "TalhaManzoor" -PublisherDisplayName "Talha Manzoor" -PublisherPrefix "tal" -SolutionName "CountrySelector" -PackageType Both

      - name: Verify managed solution
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = Get-Item "Solution/CountrySelector/bin/Release/CountrySelector_managed.zip"
          $archive = [IO.Compression.ZipFile]::OpenRead($zip.FullName)
          try {
            $entry = $archive.Entries | Where-Object FullName -eq "solution.xml"
            $reader = New-Object IO.StreamReader($entry.Open())
            [xml]$sx = $reader.ReadToEnd(); $reader.Close()
            $m = $sx.ImportExportXml.SolutionManifest
            $pub = ($m.Publisher.LocalizedNames.LocalizedName | Select-Object -First 1).description
            Write-Host "Solution: $($m.UniqueName) v$($m.Version) managed=$($m.Managed)"
            Write-Host "Publisher: $pub ($($m.Publisher.UniqueName)) prefix=$($m.Publisher.CustomizationPrefix)"
            $archive.Entries | ForEach-Object { Write-Host "  $($_.FullName)" }
            if ($m.Managed -ne "1") { throw "Solution is not managed" }
            if ($pub -ne "Talha Manzoor") { throw "Unexpected publisher display name: $pub" }
            if (-not ($archive.Entries | Where-Object FullName -like "Controls/*bundle.js")) { throw "PCF bundle missing" }
          } finally { $archive.Dispose() }

      - name: Upload solution zips
        uses: actions/upload-artifact@v4
        with:
          name: CountrySelector-solution
          path: Solution/CountrySelector/bin/Release/*.zip
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Solution/CountrySelector/bin/Release/*.zip
